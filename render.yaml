# Render Blueprint — deploys the whole app (API + built React frontend) as a
# single free web service. In Render: New → Blueprint → connect this repo.
#
# Secrets are NOT stored here. render.yaml commits to git, so anything marked
# `sync: false` is left blank for you to paste into the Render dashboard once,
# and the JWT secrets are auto-generated by Render.
services:
  - type: web
    name: ca-firm-saas
    runtime: node
    plan: free
    # Installs all workspace deps, then builds the React app into client/dist.
    buildCommand: npm install && npm run build
    # Root "start" script -> runs the server, which serves the API and the
    # built frontend from the same origin.
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Auth secrets — Render generates strong random values for these.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EMAIL_SECRET
        generateValue: true

      # Paste these in the Render dashboard (Environment tab):
      - key: MONGO_URI          # from MongoDB Atlas
        sync: false
      - key: CLIENT_URL         # e.g. https://ca-firm-saas.onrender.com
        sync: false

      # Optional — leave blank to skip. Uploads need Cloudinary; email needs SMTP.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
